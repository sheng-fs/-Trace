name: CI - Build & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 支持手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_OUTPUT_ON_FAILURE: ON

jobs:
  # =========================================================================
  # Windows (MSVC + Qt 6)
  # =========================================================================
  build-windows:
    name: "Windows / MSVC 2022 + Qt 6"
    runs-on: windows-2022
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: "qtcharts"

      - name: Configure (CMake)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # =========================================================================
  # macOS (Apple Clang + Qt 6)
  # =========================================================================
  build-macos:
    name: "macOS 13 / Apple Clang + Qt 6"
    runs-on: macos-13
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          modules: "qtcharts"

      - name: Configure (CMake)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # =========================================================================
  # Linux (GCC + Qt 6, Ubuntu 22.04)
  # =========================================================================
  build-linux:
    name: "Ubuntu 22.04 / GCC + Qt 6"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libudev-dev \
            libsystemd-dev \
            libcurl4-openssl-dev

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: "linux"
          target: "desktop"
          arch: "gcc_64"
          modules: "qtcharts"

      - name: Configure (CMake)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # =========================================================================
  # 静态分析 (clang-tidy) — 仅 Linux
  # =========================================================================
  static-analysis:
    name: "Static Analysis (clang-tidy)"
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang-tidy \
            build-essential \
            libudev-dev \
            libsystemd-dev \
            libcurl4-openssl-dev

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: "linux"
          target: "desktop"
          arch: "gcc_64"

      - name: Configure (CMake)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          run-clang-tidy -p build -quiet \
            -header-filter=".*/src/.*" \
            src/**/*.cpp src/**/*.h 2>&1 | tee clang-tidy.log
        continue-on-error: true